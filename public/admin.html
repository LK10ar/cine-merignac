<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin – Ciné Mérignac</title>
<style>*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#f4f4f7;color:#14141c}.w{max-width:1000px;margin:auto;padding:20px}
.card{background:#fff;border:1px solid #e3e3ea;border-radius:14px;padding:20px;margin-bottom:18px}h1{font-size:22px}label{display:block;font-size:13px;color:#6b6b7a;margin:10px 0 0}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d5d5de;border-radius:10px;font:inherit;margin-top:4px}input[type=checkbox]{width:auto}
.b{background:#e5173f;color:#fff;border:0;border-radius:99px;padding:10px 18px;font-weight:600;cursor:pointer}.b.o{background:none;color:#14141c;border:1px solid #d5d5de}.b.s{padding:5px 12px;font-size:13px}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs .b:not(.on){background:none;color:#14141c;border:1px solid #d5d5de}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 16px}
table{width:100%;border-collapse:collapse}td,th{padding:9px 6px;border-bottom:1px solid #eee;text-align:left}.err{color:#e5173f;margin-top:8px}</style></head><body><div class="w" id="app"></div>
<script>
const FM=[["title","Titre *"],["status","Statut",["old:À l'affiche","new:Nouveauté de la semaine","soon:Prochainement"]],["duration","Durée (ex. 1h40)"],["rating","Public"],["genre","Genre"],["director","Réalisateur"],["cast","Acteurs"],["releaseDate","Date de sortie"],["poster","URL de l'affiche"],["backdrop","URL image large (carrousel)"],["trailer","Lien YouTube de la bande-annonce"],["synopsis","Synopsis","area"],["featured","Mettre en avant dans le carrousel","chk"]];
const CFG={films:{l:"Films",cols:["title","status","duration"],f:FM},
seances:{l:"Séances",cols:["film","date","time","room"],f:[["film","Film *","films"],["date","Date *","date"],["time","Horaires * (plusieurs possibles : 14h00, 16h30, 19h00)"],["room","Salle"],["version","Version (VF, VOST…)"],["thx","Salle THX","chk"]]},
events:{l:"Évènements",cols:["title","label","date"],f:[["title","Titre *"],["label","Étiquette (Avant-première, Ciné-débat…)"],["date","Date (texte libre)"],["text","Description","area"],["image","URL de l'image"],["featured","Mettre en avant","chk"]]}};
let T=sessionStorage.t,tab="films",D={films:[],seances:[],events:[]},ed=null,msg="";const $=s=>document.querySelector(s);
const api=async(m,u,b)=>{const r=await fetch("/api/"+u,{method:m,headers:{"Content-Type":"application/json",Authorization:"Bearer "+T},body:b&&JSON.stringify(b)});if(r.status==401&&u!="login"){sessionStorage.removeItem("t");T=null;draw();throw"Session expirée"}const j=await r.json();if(!r.ok)throw j.error||"Erreur";return j};
const load=async()=>{for(const k in D)D[k]=await api("GET",k)};
const fn=id=>(D.films.find(f=>f._id==id)||{}).title||"?";
function field([k,l,t],v){v=v??"";if(t=="chk")return`<label><input type=checkbox name=${k} ${v?"checked":""}> ${l}</label>`;
if(t=="area")return`<label>${l}<textarea name=${k} rows=3>${v}</textarea></label>`;
if(t=="films")return`<label>${l}<select name=${k}>${D.films.map(f=>`<option value="${f._id}" ${f._id==v?"selected":""}>${f.title}</option>`).join("")}</select></label>`;
if(Array.isArray(t))return`<label>${l}<select name=${k}>${t.map(o=>{const[a,b]=o.split(":");return`<option value="${a}" ${a==v?"selected":""}>${b}</option>`}).join("")}</select></label>`;
return`<label>${l}<input name=${k} type="${t=="date"?"date":"text"}" value="${String(v).replace(/"/g,"&quot;")}"></label>`}
function draw(){const a=$("#app");if(!T){a.innerHTML=`<div class=card style="max-width:380px;margin:80px auto"><h1>Administration</h1><label>Mot de passe<input id=pw type=password></label><p><button class=b id=go>Connexion</button></p><div class=err id=e></div></div>`;
const go=async()=>{try{T=(await api("POST","login",{password:$("#pw").value})).token;sessionStorage.t=T;await load();draw()}catch(e){$("#e").textContent=e}};$("#go").onclick=go;$("#pw").onkeydown=e=>e.key=="Enter"&&go();return}
const c=CFG[tab],it=D[tab];
a.innerHTML=`<h1>Ciné Mérignac – administration</h1><div class=tabs>${Object.keys(CFG).map(k=>`<button class="b ${k==tab?"on":""}" data-t=${k}>${CFG[k].l}</button>`).join("")}<span style="flex:1"></span><a class="b o" href="/" target=_blank>Voir le site</a> <button class="b o" id=out>Déconnexion</button></div>
<div class=card><b>${ed?"Modifier":"Ajouter"} – ${c.l}</b><form id=fm><div class=g>${c.f.map(f=>field(f,ed&&ed[f[0]]!=null?(f[2]=="films"&&ed.film?ed.film:ed[f[0]]):"")).join("")}</div><p><button class=b>Enregistrer</button> ${ed?'<button type=button class="b o" id=cx>Annuler</button>':""}</p><div class=err>${msg}</div></form></div>
<div class=card><table><tr>${c.cols.map(k=>`<th>${k}</th>`).join("")}<th></th></tr>${it.map(x=>`<tr>${c.cols.map(k=>`<td>${k=="film"?fn(x.film):x[k]??""}</td>`).join("")}<td style="text-align:right"><button class="b o s" data-e=${x._id}>Modifier</button> <button class="b o s" data-d=${x._id}>Supprimer</button></td></tr>`).join("")||"<tr><td>Rien pour le moment</td></tr>"}</table></div>`;
$("#out").onclick=()=>{sessionStorage.removeItem("t");T=null;draw()};
a.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;ed=null;msg="";draw()});
a.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{ed=it.find(x=>x._id==b.dataset.e);draw();scrollTo(0,0)});
a.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("Supprimer définitivement ?")){await api("DELETE",tab+"/"+b.dataset.d);await load();draw()}});
if(ed)$("#cx").onclick=()=>{ed=null;draw()};
$("#fm").onsubmit=async e=>{e.preventDefault();const o={};c.f.forEach(([k,,t])=>{const el=e.target.elements[k];o[k]=t=="chk"?el.checked:el.value});
try{if(tab=="seances"&&!ed){for(const t of o.time.split(",").map(s=>s.trim()).filter(Boolean))await api("POST","seances",{...o,time:t})}else await api(ed?"PUT":"POST",tab+(ed?"/"+ed._id:""),o);ed=null;msg="";await load();draw()}catch(er){msg=er;draw()}};}
T?load().then(draw).catch(draw):draw();
</script></body></html>
