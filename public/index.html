<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>:root{--p:#e5173f;--bg:#222;--pn:#0a4f6b;--tx:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px var(--f,Montserrat),system-ui,sans-serif}a{color:inherit;text-decoration:none}

<script>
const $=s=>document.querySelector(s),A=u=>fetch('/api/'+u).then(r=>r.json()),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

 document.title=S.seoTitle||S.siteName||'Cinéma';if(S.favicon){const l=document.createElement('link');l.rel='icon';l.href=S.favicon;document.head.appendChild(l)}if(S.ogImage){const m=document.createElement('meta');m.setAttribute('property','og:image');m.content=S.ogImage;document.head.appendChild(m)}$('meta[name=description]').content=S.seoDesc||'';
 $('#lg').innerHTML=S.logo?`<img src="${e(S.logo)}" alt="${e(S.siteName)}">`:`<span class="logo">${e(S.siteName||'Cinéma')}</span>`;
 const mn=Array.isArray(S.menu)&&S.menu.length?S.menu:[{label:'Films',url:'#/films'},{label:'Évènements',url:'#/events'},{label:'Actualités',url:'#/actus'}];$('#nv').innerHTML=mn.map(m=>`<a href="${e(m.url)}" ${/^http/.test(m.url)?'target=_blank rel=noopener':''}>${e(m.label)}</a>`).join('');
 const al=(h,t)=>`<a href="${e(h)}">${e(t)}</a>`,fp=P.filter(x=>x.inFooter).sort((a,b)=>(a.order||0)-(b.order||0)).map(x=>al('#/page/'+x._id,x.title)).join(''),

 ct=[e(S.address),e(S.phone),S.email&&`<a href="mailto:${e(S.email)}">${e(S.email)}</a>`].filter(Boolean).join(' · '),

 $('#ft').innerHTML=`<div class="fl">${al('#/','Accueil')}${al('#/films',"Films à l'affiche")}${al('#/events','Évènements')}${al('#/actus','Actualités')}${fp}${cu}</div>${ct?`<p>${ct}</p>`:''}${so?`<p>${so}</p>`:''}<small>${e(S.footer)}</small>`;route()}
function route(){clearInterval(tm);const[,p,id]=location.hash.slice(1).split('/'),v=$('#v');scrollTo(0,0);

addEventListener('hashchange',route);
document.addEventListener('click',x=>{const c=x.target.closest('[data-sc]');if(c){c.parentNode.querySelector('.row').scrollBy({left:+c.dataset.sc*540,behavior:'smooth'});return}const tr=x.target.closest('[data-tr]');if(tr){const m=$('#tr');m&&m.scrollIntoView({behavior:'smooth',block:'start'});return}const t=x.target.closest('[data-d]');if(t){day=t.dataset.d;keep()}});

const embed=u=>{u=String(u||'').trim();if(!u)return'';const w=h=>`<div class="vd">${h}</div>`;
 let m=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/)||u.match(/^([\w-]{11})$/);
 if(m)return w(`<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" title="Bande-annonce" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;fullscreen" allowfullscreen loading="lazy"></iframe>`);

const filmsHTML=()=>`<h2>Horaires des films</h2><div class="panel">${tabs()}${F.filter(x=>x.status!='soon').map(x=>`<div class="film"><a href="#/film/${x._id}">${img(x.poster)}</a><div style="flex:1"><a href="#/film/${x._id}"><b style="font-size:20px">${e(x.title)}</b></a>${BADGE[x.status]?` <span class="bg2">${BADGE[x.status]}</span>`:''}<br><small>${[x.duration,x.rating,x.genre].filter(Boolean).map(e).join(' · ')}</small>${x.director?`<br><small>Réalisé par ${e(x.director)}</small>`:''}<div class="hrs">${hrs(x._id,day)}</div><p><a class="lk" href="#/film/${x._id}">Fiche du film et bande-annonce ›</a></p></div></div>`).join('')}</div>${F.some(x=>x.status=='soon')?`<h2>Prochainement</h2>${row(F.filter(x=>x.status=='soon'))}`:''}`;

 v.innerHTML=`<section class="fhero">${x.backdrop?`<img class="fbg" src="${e(x.backdrop)}" alt="">`:''}<div class="fp"><div class="pst">${img(x.poster)}</div><div class="fi">${BADGE[x.status]?`<span class="bg2">${BADGE[x.status]}</span>`:''}<h1 class="ft">${e(x.title)}</h1><p class="mt">${[x.duration,x.rating,x.genre].filter(Boolean).map(e).join(' · ')}</p>${tr?'<p><button class="btn" data-tr>▶ Bande-annonce</button></p>':''}<div class="info">${info}</div>${x.synopsis?`<h3>Synopsis</h3><p class="sy">${e(x.synopsis)}</p>`:''}${tr?`<h3 id="tr">Bande-annonce</h3>${tr}`:''}</div><aside class="panel fsc"><b style="font-size:18px">Séances</b>${a.length?`${tabs(x._id,dd)}<div class="hrs">${hrs(x._id,dd)}</div>`:'<p>Aucune séance programmée pour le moment.</p>'}</aside></div></section>${oth.length?`<h2>Autres films à l'affiche</h2>${row(oth)}`:''}`}
let Q=[];function book(id,v){const s=SE.find(z=>z._id==id),x=s&&F.find(f=>f._id==s.film);if(!s||!x)return v.innerHTML='<p>Séance introuvable.</p>';
 const T=(S.prices||'Plein:11.70').split(',').map(t=>{const i=t.lastIndexOf(':');return[t.slice(0,i),+t.slice(i+1)]});if(Q.length!=T.length)Q=T.map(()=>0);
