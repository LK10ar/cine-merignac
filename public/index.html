<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinéma</title><meta name="description" content="">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>:root{--p:#e5173f;--bg:#222;--pn:#0a4f6b;--tx:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px var(--f,Montserrat),system-ui,sans-serif}a{color:inherit;text-decoration:none}
header{background:var(--hb,#1b1b1b);color:var(--ht,#fff);position:sticky;top:0;z-index:9}.hd.c{flex-direction:column;gap:8px}.hd{max-width:1200px;margin:auto;display:flex;align-items:center;gap:22px;padding:10px 16px}.hd img{height:44px;border-radius:8px}.logo{font-weight:800;font-size:20px;color:var(--p)}
nav{display:flex;gap:18px;overflow-x:auto;white-space:nowrap;font-weight:800;text-transform:uppercase;font-size:13px}nav a:hover{color:var(--p)}
main{max-width:1200px;margin:auto;padding:16px}h2{font-size:24px;font-weight:800;margin:30px 0 14px}
.car{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:21/9;background:#111}.car img{width:100%;height:100%;object-fit:cover}.sl{position:absolute;inset:0;opacity:0;transition:.6s}.sl.on{opacity:1}
.ov{position:absolute;right:0;bottom:0;background:linear-gradient(90deg,transparent,#000b 30%);padding:24px 28px;max-width:46%;border-top-left-radius:60px}.ov h3{margin:0 0 6px;font-size:26px}
.ar{position:absolute;top:45%;background:#0008;color:#fff;border:0;font-size:26px;padding:8px 12px;border-radius:50%;cursor:pointer}
.btn{display:inline-block;border:2px solid #fff;border-radius:99px;padding:10px 20px;font-weight:800;background:none;color:#fff;cursor:pointer;font:inherit;font-weight:800}.btn.f{background:var(--p);border-color:var(--p)}
.panel{background:var(--pn);border-radius:14px;padding:16px}.tabs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}.tb{padding:8px 14px;border-radius:10px;cursor:pointer;text-align:center;font-weight:600;flex:none;border-bottom:3px solid transparent}.tb.on{border-color:var(--p);font-weight:800}
.row{display:flex;gap:14px;overflow-x:auto;padding:12px 0}.pc{flex:none;width:170px}.pc img,.ph{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;background:#333;display:block}.pc b{display:block;margin-top:8px}
.film{display:flex;gap:20px;padding:18px 0;border-bottom:1px solid #fff3}.film img,.film .ph{width:128px;height:190px;flex:none}.hrs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.h{background:#fff;color:#111;border-radius:8px;padding:8px 12px;font-weight:800;border-bottom:8px solid #0a1d2a;display:flex;gap:10px;align-items:center}.h i{color:var(--p);font-style:normal}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.cd{background:#2e2e2e;border-radius:14px;overflow:hidden}.cd img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.cd div{padding:12px}.cd small{opacity:.7}
.det{display:flex;gap:26px;flex-wrap:wrap}.det img{width:240px;border-radius:12px}.tar{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid #fff3}.q button{width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:none;color:#fff;font-size:18px;cursor:pointer}.q span{display:inline-block;width:34px;text-align:center;font-size:20px}
.bar{position:sticky;bottom:0;background:#082a3a;padding:14px;display:flex;gap:16px;justify-content:center;align-items:center;margin:20px -16px -16px}
input,textarea{width:100%;padding:11px;border-radius:8px;border:0;margin:6px 0 12px;font:inherit}footer{background:var(--fb,var(--p));color:var(--fx,#fff);margin-top:40px;padding:30px 16px;text-align:center}footer .fl{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;max-width:1000px;margin:0 auto 14px}footer a{font-weight:600;font-size:13px}footer p{margin:8px 0;font-size:13px}footer small{opacity:.85}
@media(max-width:700px){.car{aspect-ratio:4/3}.ov{max-width:100%;border-radius:0;padding:14px}.ov h3{font-size:18px}.film img,.film .ph{width:90px;height:135px}.hd{flex-wrap:wrap;gap:8px}}</style></head><body>
<header><div class="hd"><a href="#/" id="lg"></a><nav id="nv"></nav></div></header><main id="v"></main><footer id="ft"></footer>
<script>
const $=s=>document.querySelector(s),A=u=>fetch('/api/'+u).then(r=>r.json()),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={},F=[],SE=[],EV=[],N=[],P=[],day='',ci=0,tm;
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const days=()=>[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return d});
const fd=d=>d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const img=(u,c)=>u?`<img src="${e(u)}" alt="" loading="lazy">`:`<div class="ph ${c||''}"></div>`;
const hrs=(fid,dt)=>{const l=SE.filter(s=>s.film==fid&&s.date==dt);return l.length?l.map(s=>`<a class="h" href="#/book/${s._id}">${e(s.time)} <i>${e(s.version||'VF')}</i></a>`).join(''):'<small>Aucune séance ce jour</small>'};
const tabs=()=>`<div class="tabs">${days().map(d=>`<div class="tb ${iso(d)==day?'on':''}" data-d="${iso(d)}">${fd(d)}</div>`).join('')}</div>`;
async function init(){[S,F,SE,EV,N,P]=await Promise.all(['settings','films','seances','events','news','pages'].map(A));day=iso(new Date());
 const r=document.documentElement.style;if(S.primary)r.setProperty('--p',S.primary);if(S.bg)r.setProperty('--bg',S.bg);if(S.panel)r.setProperty('--pn',S.panel);[['headerBg','--hb'],['headerText','--ht'],['footerBg','--fb'],['footerText','--fx']].forEach(([k,n])=>S[k]&&r.setProperty(n,S[k]));if(S.fontFamily){r.setProperty('--f',"'"+S.fontFamily+"'");const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(S.fontFamily)+':wght@400;600;800&display=swap';document.head.appendChild(l)}if(S.headerSticky===false)document.querySelector('header').style.position='static';if(S.headerLogoPos=='center')document.querySelector('.hd').classList.add('c');
 document.title=S.seoTitle||S.siteName||'Cinéma';if(S.favicon){const l=document.createElement('link');l.rel='icon';l.href=S.favicon;document.head.appendChild(l)}if(S.ogImage){const m=document.createElement('meta');m.setAttribute('property','og:image');m.content=S.ogImage;document.head.appendChild(m)}$('meta[name=description]').content=S.seoDesc||'';
 $('#lg').innerHTML=S.logo?`<img src="${e(S.logo)}" alt="${e(S.siteName)}">`:`<span class="logo">${e(S.siteName||'Cinéma')}</span>`;
 const mn=Array.isArray(S.menu)&&S.menu.length?S.menu:[{label:'Films',url:'#/films'},{label:'Évènements',url:'#/events'},{label:'Actualités',url:'#/actus'}];$('#nv').innerHTML=mn.map(m=>`<a href="${e(m.url)}" ${/^http/.test(m.url)?'target=_blank rel=noopener':''}>${e(m.label)}</a>`).join('');
 const al=(h,t)=>`<a href="${e(h)}">${e(t)}</a>`,fp=P.filter(x=>x.inFooter).sort((a,b)=>(a.order||0)-(b.order||0)).map(x=>al('#/page/'+x._id,x.title)).join(''),
 cu=(S.footerLinks||'').split('\n').map(l=>l.split('|')).filter(a=>a[0]&&a[1]).map(([t,u])=>`<a href="${e(u.trim())}" target="_blank" rel="noopener">${e(t.trim())}</a>`).join(''),
 ct=[e(S.address),e(S.phone),S.email&&`<a href="mailto:${e(S.email)}">${e(S.email)}</a>`].filter(Boolean).join(' · '),
 so=[S.facebook&&`<a href="${e(S.facebook)}" target="_blank" rel="noopener">Facebook</a>`,S.twitter&&`<a href="${e(S.twitter)}" target="_blank" rel="noopener">X / Twitter</a>`].filter(Boolean).join(' · ');
 $('#ft').innerHTML=`<div class="fl">${al('#/','Accueil')}${al('#/films',"Films à l'affiche")}${al('#/events','Évènements')}${al('#/actus','Actualités')}${fp}${cu}</div>${ct?`<p>${ct}</p>`:''}${so?`<p>${so}</p>`:''}<small>${e(S.footer)}</small>`;route()}
function route(){clearInterval(tm);const[,p,id]=location.hash.slice(1).split('/'),v=$('#v');scrollTo(0,0);
 ({'':home,films,film,book,events:evs,actus,actu,page}[p||''])(id,v)}
addEventListener('hashchange',route);
document.addEventListener('click',x=>{const t=x.target.closest('[data-d]');if(t){day=t.dataset.d;route()}});
const vid=u=>{const m=String(u||'').match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);return m?`<div style="aspect-ratio:16/9;margin:14px 0"><iframe src="https://www.youtube.com/embed/${m[1]}" style="width:100%;height:100%;border:0;border-radius:14px" allowfullscreen></iframe></div>`:''};
const pcs=l=>l.map(x=>`<a class="pc" href="#/film/${x._id}">${img(x.poster)}<b>${e(x.title)}</b></a>`).join('');
const BK={
carousel:()=>{const f=F.filter(x=>x.featured&&(x.backdrop||x.poster));return f.length?`<div class="car">${f.map((x,i)=>`<div class="sl ${i?'':'on'}">${img(x.backdrop||x.poster)}<div class="ov"><h3>${e(x.title)}</h3><small>${e(x.duration)}</small><p><a class="btn" href="#/film/${x._id}">Réserver</a></p></div></div>`).join('')}<button class="ar" style="left:8px" id="pv">‹</button><button class="ar" style="right:8px" id="nx">›</button></div>`:''},
today:b=>{let l=F.filter(x=>x.status!='soon'&&SE.some(s=>s.film==x._id&&s.date==day));if(!l.length)l=F.filter(x=>x.status!='soon');return `<h2>${e(b.title||"Aujourd'hui au "+(S.siteName||'cinéma'))}</h2><div class="panel">${tabs()}<div class="row">${pcs(l)||'<p>Aucun film.</p>'}</div><p style="text-align:center"><a class="btn" style="background:#fff;color:#111" href="#/films">Voir tous les films</a></p></div>`},
films:()=>filmsHTML(),
soon:()=>F.some(x=>x.status=='soon')?`<h2>Prochainement</h2><div class="row">${pcs(F.filter(x=>x.status=='soon'))}</div>`:'',
events:()=>`<h2>Les évènements de votre cinéma</h2>${evg(EV.slice(0,4))}`,
news:()=>`<h2>Actualités</h2>${nwg(N.slice(0,4))}`,
title:b=>`<h2 style="text-align:${b.align||'left'}">${e(b.text)}</h2>`,
text:b=>`<div style="white-space:pre-wrap;line-height:1.7;margin:12px 0">${e(b.text)}</div>`,
image:b=>b.src?`<img src="${e(b.src)}" alt="" style="max-width:100%;border-radius:14px;display:block;margin:14px auto">`:'',
video:b=>vid(b.url),
button:b=>`<p style="text-align:center"><a class="btn f" href="${e(b.url)}">${e(b.label)}</a></p>`,
divider:()=>'<hr style="border:0;border-top:1px solid #fff3;margin:26px 0">'};
function blocks(L,v){v.innerHTML=L.map(b=>(BK[b.type]||(()=>''))(b)).join('');const s=v.querySelectorAll('.sl');ci=0;if(s.length&&$('#pv')){const go=n=>{s[ci].classList.remove('on');ci=(n+s.length)%s.length;s[ci].classList.add('on')};$('#pv').onclick=()=>go(ci-1);$('#nx').onclick=()=>go(ci+1);tm=setInterval(()=>go(ci+1),5000)}}
function home(_,v){const h=P.find(p=>p.isHome);blocks(h&&h.blocks&&h.blocks.length?h.blocks:[{type:'carousel'},{type:'today'},{type:'soon'},{type:'events'},{type:'news'}],v)}
const evg=l=>`<div class="g">${l.map(x=>`<div class="cd">${x.image?img(x.image):''}<div><small>${e(x.label)} ${e(x.date)}</small><b style="display:block">${e(x.title)}</b><p>${e(x.text)}</p></div></div>`).join('')||'<p>Rien pour le moment.</p>'}</div>`;
const nwg=l=>`<div class="g">${l.map(x=>`<a class="cd" href="#/actu/${x._id}">${x.image?img(x.image):''}<div><small>Actualité</small><b style="display:block">${e(x.title)}</b></div></a>`).join('')||'<p>Rien pour le moment.</p>'}</div>`;
const filmsHTML=()=>`<h2>Horaires des films</h2><div class="panel">${tabs()}${F.filter(x=>x.status!='soon').map(x=>`<div class="film"><a href="#/film/${x._id}">${img(x.poster)}</a><div><a href="#/film/${x._id}"><b style="font-size:20px">${e(x.title)}</b></a><br><small>${e(x.duration)} ${e(x.genre)}</small><div class="hrs">${hrs(x._id,day)}</div></div></div>`).join('')}</div>`;
function films(_,v){v.innerHTML=filmsHTML()}
function film(id,v){const x=F.find(f=>f._id==id);if(!x)return v.innerHTML='<p>Film introuvable.</p>';document.title=x.title+' – '+(S.siteName||'');
 v.innerHTML=`<div class="det">${img(x.poster)}<div style="flex:1;min-width:260px"><h2 style="margin-top:0">${e(x.title)}</h2><p>${e(x.duration)} ${x.trailer?`· <a href="${e(x.trailer)}" target=_blank>Bande annonce ▶</a>`:''}</p><p><b>Genre :</b> ${e(x.genre)}<br><b>Sortie :</b> ${e(x.releaseDate)}<br><b>Réalisé par :</b> ${e(x.director)}<br><b>Avec :</b> ${e(x.cast)}</p><p>${e(x.synopsis)}</p></div><div class="panel" style="flex:1;min-width:280px"><b>Séances</b>${tabs()}<div class="hrs">${hrs(x._id,day)}</div></div></div>`}
let Q=[];function book(id,v){const s=SE.find(z=>z._id==id),x=s&&F.find(f=>f._id==s.film);if(!s||!x)return v.innerHTML='<p>Séance introuvable.</p>';
 const T=(S.prices||'Plein:11.70').split(',').map(t=>{const i=t.lastIndexOf(':');return[t.slice(0,i),+t.slice(i+1)]});if(Q.length!=T.length)Q=T.map(()=>0);
 const tot=()=>Q.reduce((a,q,i)=>a+q*T[i][1],0);
 v.innerHTML=`<div class="panel"><h2 style="margin:0">${e(x.title)}</h2><p>${e(s.date)} à ${e(s.time)} · ${e(s.version||'VF')} · ${e(s.room||'')}</p></div><div class="panel" style="margin-top:12px" id="bk">${T.map((t,i)=>`<div class="tar"><b>${e(t[0])}</b><span>${t[1].toFixed(2)} € <span class="q"><button data-i="${i}" data-s="-1">−</button><span>${Q[i]}</span><button data-i="${i}" data-s="1">+</button></span></span></div>`).join('')}</div><div class="bar"><b id="tt">${tot().toFixed(2)} €</b><button class="btn f" id="ct">Continuer</button></div>`;
 $('#bk').onclick=z=>{const b=z.target.closest('button');if(!b)return;const i=+b.dataset.i;Q[i]=Math.max(0,Q[i]+ +b.dataset.s);b.parentNode.children[1].textContent=Q[i];$('#tt').textContent=tot().toFixed(2)+' €'};
 $('#ct').onclick=()=>{if(!tot())return alert('Choisissez au moins une place');
  v.innerHTML=`<div class="panel"><h2 style="margin-top:0">Coordonnées</h2><p>${T.map((t,i)=>Q[i]?Q[i]+' × '+e(t[0]):'').filter(Boolean).join(', ')} — <b>${tot().toFixed(2)} €</b></p><label>Nom<input id=n></label><label>Prénom<input id=p></label><label>E-mail<input id=m type=email></label><button class="btn f" id=ok>Continuer et payer ${tot().toFixed(2)} €</button></div>`;
  $('#ok').onclick=()=>{if(!$('#m').value)return alert('E-mail requis');v.innerHTML='<div class="panel"><h2>Demande enregistrée ✔</h2><p>Le paiement en ligne n\'est pas encore branché (Stripe à ajouter).</p><a class="btn" href="#/">Retour accueil</a></div>'}}}
function evs(_,v){v.innerHTML='<h2>Évènements</h2>'+evg(EV)}
function actus(_,v){v.innerHTML='<h2>Actualités</h2>'+nwg(N)}
function actu(id,v){const x=N.find(n=>n._id==id)||{};document.title=(x.title||'')+' – '+(S.siteName||'');v.innerHTML=`<h2>${e(x.title)}</h2>${x.image?`<img src="${e(x.image)}" style="max-width:100%;border-radius:14px">`:''}<p style="white-space:pre-wrap;line-height:1.7">${e(x.text)}</p>`}
function page(id,v){const x=P.find(n=>n._id==id)||{};document.title=(x.title||'')+' – '+(S.siteName||'');if(x.blocks&&x.blocks.length)blocks(x.blocks,v);else v.innerHTML=`<h2>${e(x.title)}</h2><div style="white-space:pre-wrap;line-height:1.7">${e(x.text)}</div>`}
init();
</script></body></html>
